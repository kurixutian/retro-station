name = "retro-vault"
main = "worker.js"
compatibility_date = "2024-01-01"

# Choose EITHER Option A (KV Namespace) OR Option B (R2 Bucket)
# Option A: Cloudflare KV (Fastest setup)
# 1. Run: npx wrangler kv:namespace create RETRO_VAULT
# 2. Paste the returned id below:
# [[kv_namespaces]]
# binding = "RETRO_VAULT"
# id = "YOUR_KV_NAMESPACE_ID"

# Option B: Cloudflare R2 Bucket (10 GB Free Storage, Zero Egress Fees)
# 1. Run: npx wrangler r2 bucket create retro-vault
# 2. Uncomment below:
[[r2_buckets]]
binding = "RETRO_BUCKET"
bucket_name = "retro-vault"
