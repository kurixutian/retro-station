name = "retro-vault"
main = "worker.js"
compatibility_date = "2024-09-23"

# Cloudflare R2 Bucket (10 GB free storage, zero egress fees)
# 1. npx wrangler r2 bucket create retro-vault
# 2. Bind below (already done):
[[r2_buckets]]
binding = "RETRO_BUCKET"
bucket_name = "retro-vault"

# Durable Object: one serial, race-free vault instance per sync code.
# All reads/writes/tombstone purges for a code land in a single DO, so two
# devices can never race a read-modify-write on the same vault.
[[durable_objects.bindings]]
name = "VAULT"
class_name = "VaultDO"

[[migrations]]
tag = "v1"
new_classes = ["VaultDO"]

# Optional Option A (old KV layout, kept for reference):
# [[kv_namespaces]]
# binding = "RETRO_VAULT"
# id = "YOUR_KV_NAMESPACE_ID"
