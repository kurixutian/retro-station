name: Build Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Assemble Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/retro-station.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: retro-station-apk
          path: android/app/build/outputs/apk/release/retro-station.apk
          if-no-files-found: error

      - name: Publish Latest Release on Main
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Retro Station v1.0 — Android & Web Release"
          body: |
            ## 🎮 Retro Station — Standalone Android Release

            Modern vertical handheld retro gaming experience for Web and Android.

            ### 📥 Download
            - **[retro-station.apk](https://github.com/kurixutian/retro-station/releases/download/latest/retro-station.apk)** (Direct APK Download)

            ---

            ### 🚀 Key Features
            - **🎮 Supported Systems**: Game Boy, Game Boy Color, Game Boy Advance, NES, Super NES, Sega Genesis/Mega Drive, Sega Master System, Game Gear.
            - **📦 Multi-ROM ZIP Extraction**: Import `.zip` archives directly; automatically extracts, cleans, and indexes retro games.
            - **⚡ Native Android Optimizations**:
              - Android OS Game Category (`android:appCategory="game"`) for automatic system Game Turbo optimization.
              - Fullscreen mode with hidden status bar.
              - Screen wake lock (`FLAG_KEEP_SCREEN_ON`) during active gameplay.
              - Hardware Android Back button support for closing modals and pausing emulator.
            - **☁️ Cloud Sync & Backup**:
              - Google Drive `appDataFolder` integration for cross-device save synchronization.
              - Unified battery save (`.srm`) manual export and full offline backup.
            - **💾 Per-Game Save States**: 4 isolated visual save slots per game with instant load/restore.
            - **📳 Haptics & Shaders**: CRT, LCD, and Scanline visual filter shaders with physical haptic rumble.

            ---

            ### 📲 Installation Instructions
            1. Download `retro-station.apk` to your Android device using the direct link above.
            2. Tap the downloaded file in your browser or file manager.
            3. If prompted, allow **"Install unknown apps"** for your browser or file manager.
            4. Tap **Install** and launch Retro Station!
          files: android/app/build/outputs/apk/release/retro-station.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/retro-station.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
